name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check protocol schema
        run: pnpm schema:check

      - name: Check locale sync
        run: node scripts/sync-client-locales.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build JS, Web bundle, and macOS native binaries
        run: pnpm build:native

      - name: Run Node.js test suite
        run: pnpm test

      - name: Run Swift contract tests
        run: pnpm test:swift

      - name: Run cross-language contract fixtures
        run: pnpm test:cross

      - name: Run native collector, key-store, and synthetic fixture tests
        run: node scripts/test-native-p1.mjs

      - name: Verify release native collector binary
        run: node --test tests/integration/native-p1.test.ts
        env:
          DSH_TEST_FIXTURE_HELPER: ${{ github.workspace }}/native-bin/computer-access-collector

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check protocol schema
        run: pnpm schema:check

      - name: Check locale sync
        run: node scripts/sync-client-locales.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build JS, Web bundle, and Windows native storage lock
        run: pnpm build

      - name: Run Node.js test suite
        run: pnpm test
