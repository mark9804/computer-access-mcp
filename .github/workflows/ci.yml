name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_all() {
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ]; then
              run_all
            fi
            if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
              run_all
            fi
            files=$(git -c core.quotepath=false diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" || true)
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$PUSH_BEFORE_SHA" ] || [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              run_all
            fi
            if ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              run_all
            fi
            files=$(git -c core.quotepath=false diff --name-only "${PUSH_BEFORE_SHA}" "${HEAD_SHA}" || true)
          else
            run_all
          fi

          if [ -z "$files" ]; then
            run_all
          fi

          has_macos=false
          has_windows=false
          has_shared=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              native/macos/*)
                has_macos=true
                ;;
              native/windows/*)
                has_windows=true
                ;;
              *)
                has_shared=true
                ;;
            esac
          done <<< "$files"

          if [ "$has_shared" = "true" ]; then
            macos=true
            windows=true
          elif [ "$has_macos" = "true" ] && [ "$has_windows" = "false" ]; then
            macos=true
            windows=false
          elif [ "$has_windows" = "true" ] && [ "$has_macos" = "false" ]; then
            macos=false
            windows=true
          else
            macos=true
            windows=true
          fi

          echo "Changed scopes: macos=$has_macos windows=$has_windows shared=$has_shared -> run macos=$macos windows=$windows"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check protocol schema
        run: pnpm schema:check

      - name: Check locale sync
        run: node scripts/sync-client-locales.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build JS, Web bundle, and macOS native binaries
        run: pnpm build:native

      - name: Run Node.js test suite
        run: pnpm test

      - name: Run Swift package tests
        run: pnpm test:swift

      - name: Run cross-language contract fixtures
        run: pnpm test:cross

      - name: Run native collector, key-store, and synthetic fixture tests
        run: node scripts/test-native-p1.mjs

      - name: Verify release native collector binary
        run: node --test tests/integration/native-p1.test.ts
        env:
          DSH_TEST_FIXTURE_HELPER: ${{ github.workspace }}/native-bin/computer-history-collector

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Rust clippy component
        run: rustup component add clippy

      - name: Check protocol schema
        run: pnpm schema:check

      - name: Check locale sync
        run: node scripts/sync-client-locales.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint Windows Rust workspace
        run: cargo clippy --manifest-path native/windows/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Build JS, Web bundle, and Windows native binaries
        run: pnpm build:native

      - name: Run Node.js test suite
        run: pnpm test

      - name: Run Windows Rust workspace tests
        run: cargo test --manifest-path native/windows/Cargo.toml --workspace

      - name: Run cross-language contract fixtures
        run: pnpm test:cross

      - name: Run native collector, key-store, and synthetic fixture tests
        run: node scripts/test-native-p1.mjs

      - name: Verify release native collector binary
        run: node --test tests/integration/native-p1.test.ts
        env:
          DSH_TEST_FIXTURE_HELPER: ${{ github.workspace }}/native-bin/computer-history-collector.exe
